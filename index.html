<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0}

.tab{appearance:none;background:none;border:none;font:inherit;font-size:13px;color:var(--muted);padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}

.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .n{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:6px}
main{max-width:1100px;margin:0 auto;padding:0 24px 44px}
section.page{display:none;padding-top:26px}

.pagehead{margin-bottom:20px;max-width:760px}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--wash);margin-bottom:16px}

select,input[type=number],input[type=text],input[type=password]{font:inherit;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 7px;max-width:230px}

.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chk input{accent-color:var(--ink);margin:0}
.btn{font:inherit;font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:#c6cbc4;color:var(--ink);background:var(--wash)}
.btn:active{background:#f2f4f0}
.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.solid:hover{background:#000;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.panel{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.panel-head{display:flex;align-items:flex-start;gap:14px;padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.panel-title{flex:1 1 auto;min-width:0}
.panel-title h3{font-size:13.5px}
.panel-title p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
.panel-body{padding:14px;position:relative}
.qtext{font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opt,.proj-opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s,box-shadow .12s}

.opt:not(.sel):active,.proj-opt:not(.sel):not(:disabled):active{border-color:var(--c1);background:#e6eefd}
.opt.sel{border-color:var(--ink);background:var(--wash);box-shadow:0 0 0 1px var(--ink) inset}
.opt .L{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px;flex:0 0 auto;margin-top:2px}
.opt.sel .L{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ko{border-color:var(--bad);background:var(--badbg)}
.qnav{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.progress{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress>i{display:block;height:100%;background:var(--ink);width:0%}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.labslot .panel-head{align-items:center}
.labmem{margin:0 0 14px;font-size:13.5px;line-height:1.6}
.labmem .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:8px}
.labslot .panel-title p a,.labmx a{color:var(--ink)}
.labslot .ctl>label{white-space:nowrap}
.labslot input[type=url]{min-width:0}

.labmx th .btn{padding:3px 9px;font-size:11px;margin-top:4px}
.labmx td{white-space:nowrap}
.labmx .lpts{width:58px;margin-top:4px;font:inherit;font-size:12px;padding:2px 4px;text-align:right}
.labmx .lpts.ok{outline:2px solid var(--good)}.labmx .lpts.bad{outline:2px solid var(--bad)}
.roster summary{cursor:pointer;font-weight:600;padding:6px 0}
.roster h4{margin:12px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.roster ul{margin:0 0 6px;padding-left:18px}.roster li{margin:2px 0}
.stat{border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500;letter-spacing:-0.02em;margin-top:5px;color:var(--ink)}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.pill{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--goodbg);color:var(--good)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.idle{background:#f1f2ef;color:#7b838b}
.tbl-scroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line2)}
table.data th{font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
table.data td.num,table.data th.num{text-align:right;font-family:var(--mono);color:var(--ink2)}
table.data tbody tr:hover{background:var(--wash)}
table.data tr.trk td{background:var(--wash);font-weight:700;border-bottom:1px solid var(--line)}
.proj-q{font-size:26px;font-weight:650;letter-spacing:-0.02em;line-height:1.3;margin:6px 0 18px}
.proj-opts{display:grid;gap:10px;margin-bottom:8px}
.proj-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px 16px;background:#fff;cursor:pointer}
.proj-opt:disabled{cursor:default}
.proj-opt .L{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px;flex:0 0 auto;margin-top:3px}
.proj-opt.sel{border-color:var(--ink);background:var(--wash);box-shadow:0 0 0 1px var(--ink) inset}
.proj-opt.sel .L{background:var(--ink);color:#fff;border-color:var(--ink)}
.proj-opt.reveal-ok{border-color:var(--good);background:var(--goodbg)}
.proj-opt.reveal-ok.sel{box-shadow:0 0 0 1px var(--good) inset}
.proj-opt.reveal-ok.sel .L{background:var(--good);border-color:var(--good)}
.proj-opt.reveal-ko{border-color:var(--bad);background:var(--badbg);box-shadow:0 0 0 1px var(--bad) inset}
.proj-opt.reveal-ko .L{background:var(--bad);border-color:var(--bad);color:#fff}
@media(max-width:640px){
  .hbar{padding:8px 12px;gap:10px}

  main{padding:0 12px 30px}

.bars{display:grid;gap:8px;margin:0 0 16px}

.overbanner{border:1px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:8px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.reqpanel{border:1px dashed #c6cbc4;border-radius:8px;padding:12px 14px;margin-top:12px;background:var(--wash)}
footer{border-top:1px solid var(--line);margin-top:30px;padding:14px 0 30px;color:var(--muted);font-size:11.5px}
code.mono{font-family:var(--mono);font-size:11px;background:var(--wash);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.hlogos{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}

.hlogo.extra{cursor:default}
.hlogo.extra svg{filter:grayscale(1) brightness(1.9);opacity:.4}
</style>

const BANKS = {"pt": {"aula0": [{"q": "According to UNEP & GlobalABC (2025), what share of global energy-related CO2 emissions comes from building construction and operation?", "opts": ["71%", "12%", "34%", "50%"], "a": 2}, {"q": "Which directive is the recast Energy Performance of Buildings Directive (EPBD)?", "opts": ["Directive 2010/31/EU", "Directive (EU) 2018/844", "Directive 2002/91/EC", "Directive (EU) 2024/1275"], "a": 3}, {"q": "Under the recast EPBD, which standard replaces the nearly zero-energy building (NZEB)?", "opts": ["The Passive House", "The Zero-Emission Building", "The Low-Carbon Building", "The Positive-Energy Building"], "a": 1}, {"q": "Under the recast EPBD, from which year must all new buildings be zero-emission buildings?", "opts": ["2050", "2035", "2030", "2025"], "a": 2}, {"q": "Under the recast EPBD, from which year must new public buildings be zero-emission buildings?", "opts": ["2030", "2028", "2026", "2032"], "a": 1}, {"q": "How many lessons follow this introductory lecture (L.00) in the course?", "opts": ["10", "14", "11", "8"], "a": 2}, {"q": "Into how many themes is the course syllabus grouped?", "opts": ["Four", "Eleven", "Eight", "Six"], "a": 3}, {"q": "At which scales does L.02 Climate Analysis teach you to read a site's climate?", "opts": ["Urban, rural and coastal", "Macro, meso and micro", "Annual, monthly and daily", "Global, national and regional"], "a": 1}, {"q": "According to L.04 Passive Design Strategies I, what is your first and cheapest energy strategy?", "opts": ["Photovoltaic panels", "Heat pumps", "Orientation, mass and form", "Mechanical ventilation with heat recovery"], "a": 2}, {"q": "In L.05 Passive Design Strategies II, where are comfort and energy performance said to be won or lost?", "opts": ["In the heating plant", "In the furniture layout", "In the electrical installation", "In the building envelope"], "a": 3}, {"q": "Which lesson covers active systems and adaptive facades as the bridge to nearly zero-energ function toWorker(url, obj){
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(obj)});
}

    return localStorage.getItem("qa_submit") || BAKED_SUBMIT || "";

}

function lockRemaining(){ return Math.max(0, lockInfo().u - Date.now()); }
function tryCode(){
  const inp=$("#c-code"); if(!inp||inp.disabled) return;
  const now=Date.now(), info=lockInfo();
  if(now<info.u){ refreshLockMsg(); return; }
  if(inp.value===SETTINGS_CODE){ lockSave({f:0,u:0}); UNLOCKED=true; renderQuiz(); return; }
  info.f=(info.f||0)+1;
  if(info.f===3) info.u=now+5*60*1000;
  else if(info.f===4) info.u=now+10*60*1000;
  else if(info.f>=5) info.u=now+60*60*1000;
  lockSave(info); inp.value=""; refreshLockMsg();
}
function refreshLockMsg(){
  const m=$("#c-lockmsg"); if(!m) return;
  if(window._lockT){ clearInterval(window._lockT); window._lockT=null; }
  const info=lockInfo(), rem=info.u-Date.now();
  const inp=$("#c-code");
  if(rem>0){
    if(inp) inp.disabled=true;
    const tick=()=>{
      const r=lockInfo().u-Date.now(), mm=$("#c-lockmsg"), ii=$("#c-code");
      if(r<=0){
        if(window._lockT){clearInterval(window._lockT);window._lockT=null;}
        if(ii) ii.disabled=false;
        if(mm) mm.textContent=`${t("wrongCode")} (0 ${t("triesLeft")})`;
      }else if(mm){
        mm.textContent=`${t("lockedMsg")} ${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")} ${t("minShort")}`;
      }
    };
    tick();
    window._lockT=setInterval(tick,1000);
  }else{
    if(inp) inp.disabled=false;
    const left=Math.max(0,3-(info.f||0));
    m.textContent=(info.f||0)>0?`${t("wrongCode")} (${left} ${t("triesLeft")})`:"";
  }
}

function rnd(n){ // crypto-backed int in [0,n)
  const b = new Uint32Array(1);
  crypto.getRandomValues(b);
  return b[0] % n;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sampleIdx(n,k){ return shuffle([...Array(n).keys()]).slice(0,k); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }

      if(UNLOCKED){ UNLOCKED=false; renderQuiz(); return; }

      w.style.display = w.style.display==="none" ? "block" : "none";
      if(w.style.display!=="none"){ refreshLockMsg(); $("#c-code").focus(); }
    };

      if(DEF.mode==="quiz"){ startQuiz(); return; }

      TAB="proj"; renderTabs(); renderPage();

    $("#c-name").addEventListener("focus", cleanName);
    if(Q && Q.done) renderResult($("#q-result"));
  } else {
    renderAttempt(el);
  }
}

  });});
  HOUSE_EXTRA.forEach(([k,disp])=>{ const svg=HOUSE_LOGO[k]||""; html+=`<div class="hlogo extra grey" title="${esc(disp)}">${svg}<div class="hc">·</div></div>`; });
  box.innerHTML=html;
  box.querySelectorAll(".hlogo:not(.extra)").forEach(d=>d.onclick=()=>{ const s=$("#l-grp"); if(!s) return; s.value=d.dataset.v; s.onchange(); });
}

    <div id="l-slots"></div>`;
  $("#l-prof").onchange=()=>{
    LABTRACK=$("#l-prof").value;
    try{ localStorage.setItem("qm_labtrack",LABTRACK); }catch(e){}
    try{ // drop the group if it belongs to the other professor's track
      const g=localStorage.getItem("qm_lab");
      if(g){ const pp=labParse(g); if(pp && LABTRACK && pp.track!==LABTRACK) localStorage.removeItem("qm_lab"); }
    }catch(e){}
    LABST=null; renderLab();
  };
  $("#l-grp").onchange=()=>{
    try{ localStorage.setItem("qm_lab",$("#l-grp").value); }catch(e){}
    const p=labParse($("#l-grp").value);
    if(p && p.track!==LABTRACK){ // group implies its professor: follow it
      LABTRACK=p.track;
      try{ localStorage.setItem("qm_labtrack",LABTRACK); }catch(e){}
      LABST=null; renderLab(); return;
    }
    LABST=null; drawMembers(); loadLabStatus();
  };
  for(let k=1;k<=LAB_N;k++){ const fi=$("#l-furl"+k); if(fi) fi.value=slotFolderStored(k)||LAB_FOLDERS[k]||""; }
  const fsv=$("#l-fsave");
  if(fsv){ fsv.onclick=()=>{ for(let k=1;k<=LAB_N;k++){ const fi=$("#l-furl"+k); if(!fi) continue; const v=fi.value.trim(); try{ if(v) localStorage.setItem("qa_folder_"+k,v); else localStorage.removeItem("qa_folder_"+k); }catch(e){} } renderLab(); }; }
  drawMembers();
  if(LABST && LABST.grp===grp) drawLabSlots(); // last known state at once, then a fresh one (the teacher may have opened one)
  loadLabStatus();
}
function drawMembers(){ // the chosen group's students, straight from LAB_GROUPS (professor shown by the selector)
  const el=$("#l-members"), p=labParse($("#l-grp").value); if(!el) return;
  const g=p && (LAB_GROUPS[p.track]||[]).find(x=>x[0]===p.g), names=(g && g[2]) || [];
  el.hidden=!names.length;
  el.innerHTML=names.length ? `<span class="k">${esc(t("labMembers"))}</span>${names.map(esc).join(" · ")}` : "";
  drawLogos();
}
async function loadLabStatus(){ // "open the group": its 5 submissions, open/closed and what was handed in
  const out=$("#l-slots"), msg=$("#l-msg"), grp=$("#l-grp").value, p=labParse(grp);
  if(!p){ out.innerHTML=`<p class="hint">${esc(t("labPick"))}</p>`; return; }
  const url=submitURL(); if(!url){ msg.textContent=t("trNeedURL"); return; }
  msg.textContent=t("clsBusy");
  try{
    const r=await toWorker(url,{action:"labstatus", track:p.track, g:p.g});
    const j=await r.json().catch(()=>({}));
    if($("#l-grp").value!==grp) return; // another group was chosen meanwhile
    if(!r.ok || !j.ok){ out.innerHTML=""; msg.textContent = r.status===403 ? t("labOld") : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""})`; return; }
    msg.textContent=""; LABST={grp, open:j.open||[], subs:j.subs||{}}; drawLabSlots();
  }catch(e){ msg.textContent=await workerDiag(url); }
}
function slotFolderStored(k){
  try{ return localStorage.getItem("qa_folder_"+k) || ""; }catch(e){ return ""; }
}
function slotFolder(k){
  return slotFolderStored(k) || LAB_FOLDERS[k] || folderURL() || "";
}
function drawLabSlots(){
  const out=$("#l-slots"); if(!out || !LABST) return;
  out.innerHTML=[...Array(LAB_N).keys()].map(i=>{
    const k=i+1, open=LABST.open.includes(k), x=LABST.subs[k];
    const last = !x ? "" : `${esc(t("labLast"))} ${esc(fmtLocal(x.date))} · ${x.kind==="pdf" ? `${esc(x.file||"PDF")} (${fmtMB(x.size)})`
      : safeLink(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(t("labLinkW"))}</a>` : esc(t("labLinkW"))}`;
    const pill = x ? `<span class="pill ok">${esc(t("labDone"))}</span>` : `<span class="pill ${open?"idle":"bad"}">${esc(t(open?"labOpen":"labClosed"))}</span>`;
    return `<div class="panel labslot"><div class="panel-head"><div class="panel-title"><h3>${esc(labSubName(k))}</h3>${last?`<p>${last}</p>`:""}</div>${pill}</div>
      <div class="panel-body">${open ? `<div class="controls" style="margin:0">
        <span class="ctl"><label>PDF ≤ 10 MB</label><input type="file" id="l-f${k}" accept="application/pdf,.pdf"></span>
        <span class="ctl"><label>${esc(t("labOr"))}</label><input type="url" id="l-l${k}" placeholder="${esc(t("labLinkPh"))}" style="width:230px"></span>
        <button class="btn solid" id="l-s${k}">${esc(t(x?"labResend":"labSend"))}</button>
        <span class="hint" id="l-m${k}">${x?esc(t("labReplace")):""}</span></div>`
      : `<p class="hint" style="margin:0">${esc(t("labClosedMsg"))}</p>`}
      ${(()=>{const fU=slotFolder(k); return fU?`<div class="qnav" style="margin:10px 0 0"><a class="btn" href="${esc(fU)}" target="_blank" rel="noopener">${esc(t("labFolderGo"))} ↗</a><span class="hint">PDF ≤ 10 MB</span></div>`:"";})()}</div></div>`;
  }).join("");
  for(let k=1;k<=LAB_N;k++){ const b=$("#l-s"+k); if(b) b.onclick=()=>labSend(k); }
}
const fileB64 = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=()=>no(r.error); r.readAsDataURL(f); });
async function labSend(k){
  const msg=$("#l-m"+k), btn=$("#l-s"+k), p=labParse($("#l-grp").value);
  const f=$("#l-f"+k).files[0], link=$("#l-l"+k).value.trim();
  if(!p){ msg.textContent=t("labPick"); return; }
  if(!f && !link){ msg.textContent=t("labNeedFile"); return; }
  if(f && !(f.type==="application/pdf" || /\.pdf$/i.test(f.name))){ msg.textContent=t("labNotPdf"); return; }
  if(f && f.size>LAB_MAX){ msg.textContent=t("labTooBig"); return; }
  if(!f && !safeLink(link)){ msg.textContent=t("labBadLink"); return; }
  const url=submitURL(); if(!url){ msg.textContent=t("trNeedURL"); return; }
  btn.disabled=true; msg.textContent=t("labSending");
  try{
    const q=new URLSearchParams({action:"labsubmit", track:p.track, g:p.g, k:String(k)}); // a group submission, no submitter name
    let body="";
    if(f){ q.set("file", f.name); body=await fileB64(f); } else { q.set("kind","link"); q.set("link",link); }
    const r=await fetch(url+(url.includes("?")?"&":"?")+q, {method:"POST", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){
      await loadLabStatus(); const m=$("#l-m"+k); if(m) m.textContent=t("labSent"); return;
    }
    if(j.error==="closed"){ await loadLabStatus(); ($("#l-m"+k)||$("#l-msg")).textContent=t("labIsClosed"); return; } // closed meanwhile: show the fresh state
    msg.textContent = (r.status===413 || j.error==="too large") ? t("labTooBig")
      : j.error==="not pdf" ? t("labNotPdf") : j.error==="link" ? t("labBadLink") : (r.status===403 || j.error==="bad json") ? t("labOld")
      : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ msg.textContent=await workerDiag(url); }
  btn.disabled=false;
}
function startQuiz(){
  const nm=$("#c-name").value.trim(), kg=$("#c-klass").value;
  if(/^(https?:\/\/|www\.)/i.test(nm)){
    $("#c-warn").textContent=t("badName");
    $("#c-name").focus();
    return;
  }
  if(!nm || !kg){
    $("#c-warn").textContent=t("needId");
    (!nm?$("#c-name"):$("#c-klass")).focus();
    return;
  }
  const lesson = LESSON_SEL;
  const bank = currentBank(lesson);
  const n = Math.max(1, Math.min(bank.length, parseInt($("#c-n").value||"10",10)));
  const shQ = $("#c-sq").checked, shO = $("#c-so").checked;
  const idx = shQ ? sampleIdx(bank.length, n) : [...Array(bank.length).keys()].slice(0,n);
  const items = idx.map(bi => {
    const s = bank[bi];
    const order = shO ? shuffle([0,1,2,3]) : [0,1,2,3];
    return { q:s.q, opts:order.map(o=>s.opts[o]), correct:order.indexOf(s.a), src:bi };
  });
  const mins = parseInt($("#c-min").value||"0",10);
  Q = { lesson, n, items, ans:{}, i:0, done:false,
        oneBy:$("#c-ob").checked, name:$("#c-name").value.trim(),
        klass:$("#c-klass").value.trim(), id:newAttemptId(), mins,
        startT:Date.now(), left:mins>0?mins*60:null, timerId:null, bankSize:bank.length };
  if(Q.left!==null){
    Q.timerId = setInterval(()=>{
      Q.left--;
      qTick();
      if(Q.left<=0){ clearInterval(Q.timerId); finishQuiz(true); }
    },1000);
  }
  renderQuiz();
}
function qTick(){
  const m=$("#q-timer"), bar=$("#q-tbar");
  if(m){ m.textContent=fmtTime(Q.left); m.className="ptimer "+pBand(Q.left); }
  if(bar && Q.mins){ bar.style.width=(Math.max(0,Q.left)/(Q.mins*60)*100).toFixed(1)+"%"; bar.className=pBand(Q.left); }
}

function finishQuiz(auto){

function renderSendPanel(){ // quiz mode: status of the automatic send
  const box=$("#r-sendstatus"); if(!box || !Q) return;
  box.innerHTML=sendStatusHTML(Q,"r-retry");

function resultPayload(code,A){ // A: attempt (quiz Q or projector S)
  A=A||Q;
  return {code, id:A.id, name:A.name, klass:A.klass, lesson:LESSON[LANG][A.lesson],
    n:A.n, score:A.score, pct:+(A.score/A.n*100).toFixed(1), secs:A.secs,
    date:new Date().toISOString(),
    detail:A.items.map((it,i)=>`${it.src+1}:${A.ans[i]===undefined?"-":LETTERS[A.ans[i]]}${A.ans[i]===it.correct?"✓":"✗"}`).join(" ")};

/* ---------- sending results: automatic, no code to type ---------- */
// Class code sent with a result: a ?code= link wins, otherwise the lecture itself (aula2 -> "Lecture02"),
// which is what the Worker's CLASS_CODE lists.
function classCode(lesson){ return DEF.code || "Lecture"+String(lesson).replace(/\D/g,"").padStart(2,"0"); }
async function postAttempt(A){ // "" when stored, otherwise the reason to show
  const url=submitURL();
  try{
    const r=await toWorker(url, resultPayload(classCode(A.lesson), A));
    if(r.ok){ try{localStorage.setItem("qa_sent_"+A.id,"1");}catch(e){} return ""; }
    if(r.status===403) return `${t("codeRejected")} ${classCode(A.lesson)}`;
    const j=await r.json().catch(()=>({}));
    return `${t("srvFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ return await workerDiag(url); }
}
function autoSend(A, redraw){ // A.send: "sending" | "fail" (A.sendMsg = reason); A.sent once stored
  if(!submitURL() || A.sent || A.send==="sending") return;
  A.send="sending"; A.sendMsg=""; redraw();
  postAttempt(A).then(m=>{ A.send=m?"fail":"done"; A.sendMsg=m; if(!m) A.sent=true; redraw(); });
}
function sendStatusHTML(A, retryId){
  return A.sent ? `<span class="pill ok">${esc(t("sent"))}</span><span class="meta">${esc(A.id)}</span>`
    : A.send==="fail" ? `<button class="btn solid" id="${retryId}">${esc(t("sendAgain"))}</button><span class="hint">${esc(A.sendMsg)}</span>`
    : `<span class="hint">${esc(t("sending"))}</span>`;
}
// The POST got no readable answer: ask the Worker with a plain GET to tell "offline / wrong code deployed"
// from "quiz Worker deployed but it crashed" (our worker.js answers GET with {"error":"POST only"} + CORS).
async function workerDiag(url){
  try{
    const r=await fetch(url); const j=await r.json();
    if(j && j.error==="POST only") return t("wkCrash");
  }catch(e){}
  return `${t("wkDown")} ${url}`;
}

const BAKED_PROF = ""; // replaced at build; teacher address for restart requests (or ?prof= link)
function profEmail(){
  try{
    const q = new URLSearchParams(location.search).get("prof");
    if(q){ localStorage.setItem("qa_prof", q); return q; }
    return localStorage.getItem("qa_prof") || BAKED_PROF || "";
  }catch(e){ return BAKED_PROF || ""; }
}
/* ---------- projector (timed session, restart locked behind professor) ---------- */
let P = {lesson:"aula0", deck:[], pos:-1, show:false, pick:null, endsAt:0, over:false, wantReveal:false};
function projReshuffle(full){
  if(full!==false){ P.endsAt=0; P.over=false; if(window._ptT){clearInterval(window._ptT);window._ptT=null;} }
  P.wantReveal=false;
  const bank = currentBank(P.lesson);
  P.deck = shuffle([...Array(bank.length).keys()]);
  P.pos = -1; P.show = false; P.pick = null;
}
/* student attempt (after Proceed): N questions from the deck, next question on answer, score at the end */
let S = null; // {id,name,klass,lesson,n,items:[{src,correct}],ans:{},startT,done,timedOut,secs,score,sent}
const ADVANCE_MS = 500; // pause on the chosen answer before the next question
function startSession(nm,kg){
  P.lesson=LESSON_SEL; projReshuffle();
  const bank=currentBank(P.lesson), sel=$("#c-n"); // "Questions" setting on the start screen (default ?n=, else 20)
  const n=Math.min((sel && parseInt(sel.value,10)) || DEF.n, bank.length);
  S={id:newAttemptId(), name:nm, klass:kg, lesson:P.lesson, n, ans:{},
     items:P.deck.slice(0,n).map(bi=>({src:bi, correct:bank[bi].a})),
     startT:Date.now(), done:false, timedOut:false, secs:0, score:0, sent:false};
  P.pos=0; P.endsAt=Date.now()+DEF.mins*60*1000;
}
function finishSession(timedOut){
  if(!S || S.done) return;
  clearTimeout(P.advT);
  if(window._ptT){clearInterval(window._ptT);window._ptT=null;}
  S.done=true; S.timedOut=!!timedOut; P.endsAt=0; P.show=false; P.wantReveal=false;
  S.secs=Math.round((Date.now()-S.startT)/1000);
  S.score=S.items.filter((it,i)=>S.ans[i]===it.correct).length;
  saveResult(S);
  const A=S;
  autoSend(A, ()=>{ if(TAB==="proj" && S===A) renderProj(); });
  if(TAB==="proj") renderProj();
}
function pBand(rem){ return rem>600?"g":rem>=300?"y":"r"; }
function pTick(){
  const tm=$("#p-timer"), bar=$("#p-bar");
  if(!tm || !P.endsAt){ if(window._ptT){clearInterval(window._ptT);window._ptT=null;} return; }
  const rem=Math.max(0, Math.round((P.endsAt-Date.now())/1000));
  if(rem<=0){ pTimeUp(); return; }
  const b=pBand(rem), total=DEF.mins*60;
  tm.textContent=fmtTime(rem); tm.className="ptimer "+b;
  if(bar){ bar.style.width=(rem/total*100).toFixed(1)+"%"; bar.className=b; }
  const tl=$("#p-tleft"); if(tl) tl.textContent=fmtTime(rem);
}
// questions left: red for the first third of the answers, yellow for the second, green for the last
function qBand(left,n){ const done=(n-left)/n; return done<1/3?"r":done<2/3?"y":"g"; }
function qLeftDraw(){ // attempt: the "questions left" bar shrinks with every answer
  const left=S.n-Object.keys(S.ans).length, bar=$("#p-qbar"), v=$("#p-qleft");
  if(bar){ bar.style.width=(left/S.n*100).toFixed(1)+"%"; bar.className=qBand(left,S.n); }
  if(v) v.textContent=`${left}/${S.n}`;
}
function pTimeUp(){
  P.over=true; P.endsAt=0;

/* ---------- Portuguese translation with Gemma (teacher, through the Worker) ---------- */
// The Worker (worker.js, action "translate") holds the model; the page never sees a key.
// Output: bank-pt.json in the repo root, loaded at start-up as the PT bank (answer key from EN).
// Worker teacher code: remembered on this device once it has worked (the teacher's own computer), until Forget.
function tcodeLoad(){ try{ return localStorage.getItem("qm_tcode")||""; }catch(e){ return ""; } }
function tcodeKeep(ok){ try{ if(ok) localStorage.setItem("qm_tcode",TRCODE); else localStorage.removeItem("qm_tcode"); }catch(e){} }
let TRS = {}, TRCODE = tcodeLoad(), PTX = {}, TRMODEL = "";
function ptItemOK(it,src){ return it && typeof it.q==="string" && it.q.trim() && Array.isArray(it.opts) && it.opts.length===4 &&
  it.opts.every(o=>typeof o==="string" && o.trim()) && it.a===src.a; }
function trSay(s){ const m=$("#b-trmsg"); if(m) m.textContent=s; }
function trCell(s,i,ed){
  const at=f=>ed?` contenteditable="true" spellcheck="true" data-i="${i}" data-f="${f}"`:"";
  return `<div class="trq"${at("q")}>${esc(s.q)}</div>`+s.opts.map((o,k)=>
    `<div class="tro${k===s.a?" ok":""}"><span class="L">${LETTERS[k]}</span><span${at(k)}>${esc(o)}</span></div>`).join("");
}
function drawTR(bk){
  const out=$("#b-trout"); if(!out) return;
  if(!TRS[bk] && PTX[bk]) TRS[bk]={lesson:bk, items:PTX[bk].map(it=>({q:it.q,opts:it.opts.slice(),a:it.a})), n:PTX[bk].length, done:true, loaded:true};
  const job=TRS[bk], src=BANKS.en[bk];
  $("#b-trdl").disabled=!Object.values(TRS).some(j=>j.done) && !Object.keys(PTX).length;
  $("#b-tr").disabled=!!(job&&job.busy);
  if(!job){ out.innerHTML=""; trSay(""); return; }
  trSay(job.busy?`${t("trBusy")} ${job.items.length}/${job.n}`:job.err?job.err:job.loaded?t("trLoaded"):job.done?t("trDone"):"");
  out.innerHTML=!job.items.length?"":`<div class="tbl-scroll" style="margin-top:12px"><table class="data trtab">
    <thead><tr><th class="num">${esc(t("thN"))}</th><th>English</th><th>Português</th></tr></thead>
    <tbody>${job.items.map((it,i)=>`<tr><td class="num">${i+1}</td><td>${trCell(src[i],i,false)}</td><td>${trCell(it,i,job.done)}</td></tr>`).join("")}</tbody>
  </table></div>`;
}
async function runTranslate(bk){
  const url=submitURL();
  if(!url){ trSay(t("trNeedURL")); return; }
  if(!TRCODE){ trSay(t("trNeedCode")); $("#b-tcode").focus(); return; }
  const src=BANKS.en[bk];
  let job=TRS[bk];
  if(job && job.done && !confirm(t("trRedo"))) return;
  if(!job || job.done) job=TRS[bk]={lesson:bk, items:[], n:src.length, done:false}; // otherwise resume where it stopped
  job.busy=true; job.err="";
  const redraw=()=>{ if(TAB==="bank" && $("#b-lesson") && $("#b-lesson").value===bk) drawTR(bk); };
  redraw();
  while(job.items.length<src.length){
    const from=job.items.length, batch=src.slice(from, from+10);
    let res=null, err=t("trFail");
    for(let tries=0; tries<2 && !res; tries++){
      try{
        const r=await toWorker(url,{action:"translate", code:TRCODE, items:batch.map(s=>({q:s.q,opts:s.opts}))});
        const j=await r.json().catch(()=>({}));
        if(r.status===403){ err=t("trBadCode"); tcodeKeep(false); break; }
        if(r.ok && j.ok && Array.isArray(j.items) && j.items.length===batch.length){ res=j.items; TRMODEL=j.model||TRMODEL; tcodeKeep(true); }
        else if(j.error) err=`${t("trFail")} (${j.error})`;
      }catch(e){ err=t("netFail"); }
    }
    if(!res){ job.busy=false; job.err=err; redraw(); return; }
    res.forEach((it,k)=>job.items.push({q:it.q, opts:it.opts.slice(0,4), a:batch[k].a}));
    redraw();
  }
  job.busy=false; job.done=true; redraw();
}
function trDownload(){
  const banks={};
  Object.keys(BANKS.en).forEach(k=>{
    const job=TRS[k];
    if(job && job.done) banks[k]=job.items.map(it=>({q:it.q, opts:it.opts.slice(), a:it.a}));
    else if(PTX[k]) banks[k]=PTX[k];
  });
  if(Object.entries(banks).some(([k,L])=>!L.every((it,i)=>ptItemOK(it,BANKS.en[k][i])))){ trSay(t("trEmpty")); return; }
  const body=JSON.stringify({format:"ec-ee-machine-bank-pt", version:1, model:TRMODEL||"@cf/google/gemma-4-26b-a4b-it",
    updated:new Date().toISOString(), banks}, null, 1);
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"application/json"})); a.download="bank-pt.json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  trSay(t("trSaved"));
}
function loadPT(){ // bank-pt.json next to index.html (GitHub Pages); silently absent offline or before first upload
  fetch("bank-pt.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j || !j.banks) return;
    Object.keys(BANKS.en).forEach(k=>{
      const L=j.banks[k], src=BANKS.en[k];
      if(Array.isArray(L) && L.length===src.length && L.every((it,i)=>ptItemOK(it,src[i]))){ BANKS.pt[k]=L; PTX[k]=L; }
    });
    if(TAB==="bank") renderPage();
  }).catch(()=>{});
}

function csvEsc(v){
  v=v==null?"":String(v);
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v; // student-typed names must not run as spreadsheet formulas
  return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;

function fmtLocal(s){ // stored dates are UTC ("…T15:54:02.744Z" or local rows "2026-10-09 15:54") → local "YYYY-MM-DD HH:MM"
  s=String(s||"");
  const d=new Date(/(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s.replace(" ","T")+(s.length<=16?":00Z":"Z"));
  if(isNaN(d)) return s;
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function downloadCSV(rows, fname, withClass){
  const head=["date","name","group",...(withClass?["class"]:[]),"bank","attempt","n","score","pct","points","secs","detail"];
  const lines=[head.join(";")].concat(rows.map(r=>[fmtLocal(r.date),r.name,r.klass,...(withClass?[r.cls]:[]),r.lesson,r.id,r.n,r.score,r.pct,fmtPts(pts(r.score,r.n)).replace(".",","),r.secs,r.detail].map(csvEsc).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);

function codeCheck(val){ // teacher code with the shared escalating lockout; "" = unlocked, otherwise the message to show
  const now=Date.now(), info=lockInfo();
  const wait=r=>`${t("lockedMsg")} ${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")} ${t("minShort")}`;
  if(now<info.u) return wait(info.u-now);
  if(val===SETTINGS_CODE){ lockSave({f:0,u:0}); UNLOCKED=true; return ""; }
  info.f=(info.f||0)+1;
  if(info.f===3) info.u=now+5*60*1000;
  else if(info.f===4) info.u=now+10*60*1000;
  else if(info.f>=5) info.u=now+60*60*1000;
  lockSave(info);
  const ru=info.u-Date.now();
  return ru>0 ? wait(ru) : `${t("wrongCode")} (${Math.max(0,3-info.f)} ${t("triesLeft")})`;
}

let CLS = null; // {records, filter}: last list loaded in this tab (kept across re-renders, never stored)
async function fetchClass(){ // records, or null with the reason shown
  const url=submitURL(), msg=$("#e-clsmsg");
  if(!url){ msg.textContent=t("trNeedURL"); return null; }
  if(!TRCODE){ msg.textContent=t("trNeedCode"); $("#e-tcode").focus(); return null; }
  msg.textContent=t("clsBusy");
  try{
    const r=await toWorker(url,{action:"results",code:TRCODE});
    const j=await r.json().catch(()=>({}));
    if(r.status===403){ tcodeKeep(false); msg.textContent=await badCodeWhy(url,j); return null; }
    if(j.error==="setup"){ msg.textContent=t("clsSetup"); return null; }
    if(!r.ok || !j.ok || !Array.isArray(j.records)){ msg.textContent=`${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`; return null; }
    const isNew=tcodeLoad()!==TRCODE; tcodeKeep(true);
    msg.textContent = KIND==="lab" ? (isNew?t("tcKept"):"") // LAB: no quiz attempt count
      : (j.records.length?`${j.records.length} ${t(j.records.length===1?"clsCount1":"clsCount")}`:t("clsNone"))+(j.truncated?` ${t("clsTrunc")}`:"")+(isNew?` · ${t("tcKept")}`:"");
    CLS={records:j.records, filter:CLS?CLS.filter:"", lab:("lab" in j)?(j.lab||{open:[],subs:{}}):undefined};
    return j.records;
  }catch(e){ msg.textContent=await workerDiag(url); return null; }
}
async function badCodeWhy(url,j){ // 403 to {action:"results"}: which of the three causes
  if(j.detail==="TEACHER_CODE not set") return t("tcMissing");
  // A Worker without the results action treats the request as a student attempt: with a class code it then
  // answers 400 "shape" (nothing is saved), where a current Worker answers 403 again.
  try{
    const r=await toWorker(url,{action:"results",code:classCode(LESSON_SEL||"aula0")});
    const k=await r.json().catch(()=>({}));
    if(r.status===400 && k.error==="shape") return t("tcOldWorker");
  }catch(e){}
  return t("trBadCode");
}

let ROSTER_OPEN = false;
function drawRoster(){ // lab groups with their members (LAB_GROUPS), next to the lab submissions
  const out=$("#e-roster"); if(!out) return;
  if(!CLS){ out.innerHTML=""; return; }
  let total=0;
  const col=tr=>`<div><h4>${esc(t(tr==="architects"?"grpArch":"grpEng"))} · ${esc(LAB_PROF[tr])}</h4>${LAB_GROUPS[tr].map(([L,h,names=[]])=>{ total+=names.length;
      return `<div><b>${esc(labName(L,h))}</b><ul>${names.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`; }).join("")}</div>`;
  const cols=col("architects")+col("engineers");
  out.innerHTML=`<details class="roster" style="margin:12px 0 0"${ROSTER_OPEN?" open":""}><summary>${esc(t("rosterH"))} · ${total} ${esc(t("rosterStud"))}</summary>
    <p class="hint" style="margin:4px 0 0">${esc(t("rosterP"))}</p><div class="grid g2">${cols}</div></details>`;
  out.querySelector("details").ontoggle=e=>{ ROSTER_OPEN=e.target.open; };
}
let LAB_ADM_OPEN = null; // remembered open/closed state of the panel (default: open in LAB mode)
function drawLabAdmin(){
  const out=$("#e-lab"); if(!out) return;
  if(!CLS){ out.innerHTML=""; return; }
  if(CLS.lab===undefined){ out.innerHTML=`<p class="hint" style="margin:10px 0 0">${esc(t("labAdmOld"))}</p>`; return; }
  const L=CLS.lab, rows=[];
  ["architects","engineers"].forEach(tr=>LAB_GROUPS[tr].forEach(([g,h])=>rows.push({tr,g,h})));
  const ks=[...Array(LAB_N).keys()].map(i=>i+1), sub=(r,k)=>L.subs[`${r.tr}-${r.g}-s${k}`];
  const isOpen=LAB_ADM_OPEN===null ? KIND==="lab" : LAB_ADM_OPEN;
  out.innerHTML=`<details class="roster" style="margin:12px 0 0"${isOpen?" open":""}><summary>${esc(t("labAdmH"))} · ${esc(t("labOpenList"))}: ${L.open.length?L.open.map(k=>LAB_ITEMS[k-1]).join(", "):esc(t("labNone"))}</summary>
    <p class="hint" style="margin:4px 0 8px">${esc(t("labAdmP"))}</p>
    <div class="tbl-scroll"><table class="data labmx"><thead><tr><th>${esc(t("labGrp"))}</th>${ks.map(k=>{ const o=L.open.includes(k);
      return `<th class="num">${esc(labSubName(k))}<br><button class="btn${o?" solid":""}" data-lk="${k}" data-lo="${o?0:1}">${esc(t(o?"labCloseB":"labOpenB"))}</button><br><span class="meta">${rows.filter(r=>sub(r,k)).length}/${rows.length}</span></th>`; }).join("")}</tr></thead>
    <tbody>${["architects","engineers"].map(tr=>`<tr class="trk"><td colspan="${ks.length+1}">${esc(t(tr==="architects"?"grpArch":"grpEng"))} · ${esc(LAB_PROF[tr])}</td></tr>`+rows.filter(r=>r.tr===tr).map(r=>`<tr><td>${esc(labName(r.g,r.h))}</td>${ks.map(k=>{ const x=sub(r,k);
      if(!x) return `<td class="num">—</td>`;
      const what = x.kind==="pdf" ? `<a href="#" data-dl="${r.tr}|${r.g}|${k}">PDF</a>` : safeLink(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(t("labLinkW"))}</a>` : "";
      return `<td class="num"${x.name?` title="${esc(x.name)}"`:""}>✓ ${esc(fmtLocal(x.date))}<br>${what}</td>`; }).join("")}</tr>`).join("")).join("")}</tbody></table></div></details>`;
  out.querySelector("details").ontoggle=e=>{ LAB_ADM_OPEN=e.target.open; };
  out.querySelectorAll("[data-lk]").forEach(b=>b.onclick=()=>labToggle(+b.dataset.lk, b.dataset.lo==="1", b));
  out.querySelectorAll("[data-dl]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const [tr,g,k]=a.dataset.dl.split("|"); labDownload(tr,g,+k,a); });
}
// Points table (LAB results): column A the groups, one column per graded item, Total = average of the items graded so far
let LAB_PTS_OPEN = true;
function drawLabPoints(){
  const out=$("#e-labpts"); if(!out) return;
  if(!CLS || CLS.lab===undefined || KIND!=="lab"){ out.innerHTML=""; return; }
  const P=CLS.lab.pts||{}, rows=[];
  ["architects","engineers"].forEach(tr=>LAB_GROUPS[tr].forEach(([g,h])=>rows.push({tr,g,h})));
  const cell=(r,k)=>{ const v=P[`${r.tr}-${r.g}-s${k}`];
    return `<td class="num"><input type="number" class="lpts" min="0" max="5" step="0.5" inputmode="decimal" data-pk="${r.tr}|${r.g}|${k}" value="${v===undefined?"":esc(String(v))}" aria-label="${esc(labName(r.g,r.h))} · ${esc(LAB_ITEMS[k-1])} (0–5)"></td>`; };
  out.innerHTML=`<details class="roster" style="margin:12px 0 0"${LAB_PTS_OPEN?" open":""}><summary>${esc(t("labPtsH"))}</summary>
    <p class="hint" style="margin:4px 0 8px">${esc(t("labPtsP"))}</p>
    <div class="controls" style="margin:0 0 8px"><button class="btn" id="e-labcsv">${esc(t("labPtsCsv"))}</button></div>
    <div class="tbl-scroll"><table class="data labmx labpts"><thead><tr><th>${esc(t("labGrp"))}</th>${LAB_ITEMS.map(n=>`<th class="num">${esc(n)}</th>`).join("")}<th class="num">${esc(t("labPtsAvg"))}</th></tr></thead>
    <tbody>${["architects","engineers"].map(tr=>`<tr class="trk"><td colspan="${LAB_ITEMS.length+2}">${esc(t(tr==="architects"?"grpArch":"grpEng"))} · ${esc(LAB_PROF[tr])}</td></tr>`+rows.filter(r=>r.tr===tr).map(r=>`<tr data-row="${r.tr}|${r.g}"><td>${esc(labName(r.g,r.h))}</td>${LAB_ITEMS.map((n,i)=>cell(r,i+1)).join("")}<td class="num lavg"><b>${labAvgTxt(P,r.tr,r.g)}</b></td></tr>`).join("")).join("")}</tbody></table></div></details>`;
  out.querySelector("details").ontoggle=e=>{ LAB_PTS_OPEN=e.target.open; };
  out.querySelectorAll(".lpts").forEach(inp=>inp.onchange=()=>labSavePoints(inp));
  $("#e-labcsv").onclick=labPointsCSV;
}
const labAvg = (P,tr,g) => { const v=LAB_ITEMS.map((n,i)=>P[`${tr}-${g}-s${i+1}`]).filter(x=>typeof x==="number"); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
const labAvgTxt = (P,tr,g) => { const a=labAvg(P,tr,g); return a===null ? "—" : fmtPts(a); };
async function labSavePoints(inp){ // one group's points for one submission; saved when the field is left
  const [tr,g,k]=inp.dataset.pk.split("|"), raw=inp.value.trim().replace(",","."), msg=$("#e-clsmsg");
  const v = raw==="" ? null : Number(raw);
  inp.classList.remove("ok","bad");
  if(v!==null && !(Number.isFinite(v) && v>=0 && v<=5)){ inp.classList.add("bad"); msg.textContent=t("labPtsBad"); return; }
  const url=submitURL(); inp.disabled=true;
  try{
    const r=await toWorker(url,{action:"labpoints", code:TRCODE, track:tr, g, k:+k, points:v});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){
      CLS.lab=j.lab; inp.classList.add("ok"); msg.textContent="";
      const cell=inp.closest("tr").querySelector(".lavg b"); if(cell) cell.textContent=labAvgTxt(CLS.lab.pts||{},tr,g);
    } else { inp.classList.add("bad"); msg.textContent = r.status===403 ? await badCodeWhy(url,j) : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""})`; }
  }catch(e){ inp.classList.add("bad"); msg.textContent=await workerDiag(url); }
  inp.disabled=false;
}
function labPointsCSV(){ // one row per lab group: members, points per submission, average (decimal comma)
  const P=(CLS && CLS.lab && CLS.lab.pts)||{}, n=v=>v===undefined||v===null ? "" : fmtPts(v).replace(".",",");
  const head=["track","group","house","members",...LAB_ITEMS,"total"];
  const lines=[head.join(";")];
  ["architects","engineers"].forEach(tr=>LAB_GROUPS[tr].forEach(([g,h,names=[]])=>lines.push(
    [TRACK_EN[tr], `Group ${g}`, h, names.join(", "), ...LAB_ITEMS.map((x,i)=>n(P[`${tr}-${g}-s${i+1}`])), n(labAvg(P,tr,g))].map(csvEsc).join(";"))));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="lab-points-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
async function labToggle(k, open, btn){
  const url=submitURL(), msg=$("#e-clsmsg"); btn.disabled=true;
  try{
    const r=await toWorker(url,{action:"labopen", code:TRCODE, k, open});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){ CLS.lab=j.lab; drawLabAdmin(); return; }
    msg.textContent = r.status===403 ? await badCodeWhy(url,j) : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ msg.textContent=await workerDiag(url); }
  btn.disabled=false;
}
async function labDownload(tr, g, k, a){
  const url=submitURL(), msg=$("#e-clsmsg"); a.textContent=t("clsBusy");
  try{
    const r=await toWorker(url,{action:"labfile", code:TRCODE, track:tr, g, k});
    if(r.ok){
      const blob=await r.blob(), x=document.createElement("a");
      x.href=URL.createObjectURL(blob); x.download=`${TRACK_EN[tr]}-Group${g}-${k}-${LAB_ITEMS[k-1].replace(/[^A-Za-z]+/g,"")}.pdf`;
      document.body.appendChild(x); x.click(); setTimeout(()=>{ URL.revokeObjectURL(x.href); x.remove(); },500);
    } else { const j=await r.json().catch(()=>({})); msg.textContent=`${t("clsFail")} (${r.status}${j.error?" "+j.error:""})`; }
  }catch(e){ msg.textContent=await workerDiag(url); }
  a.textContent="PDF";
}
function drawClass(){
  drawLabPoints();
  drawLabAdmin();
  drawRoster(); // list on screen without student names (names only in the CSV): find a score by attempt code
  const out=$("#e-clsout"); if(!out) return;
  if(KIND==="lab"){ out.innerHTML=""; return; } // quiz averages and attempts only under Theoretical
  if(!CLS || !CLS.records.length){ out.innerHTML=""; return; }
  const classes=[...new Set(CLS.records.map(r=>r.class).filter(Boolean))].sort();
  if(CLS.filter && !classes.includes(CLS.filter)) CLS.filter="";
  const rows=CLS.records.filter(r=>!CLS.filter || r.class===CLS.filter).slice()
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))); // newest first
  const avg=rows.length ? rows.reduce((s,r)=>s+(+r.pct||0),0)/rows.length : 0;
  const avgPts=rows.length ? rows.reduce((s,r)=>s+pts(r.score,r.n),0)/rows.length : 0;
  const by=key=>{ // [[label, attempts, average %, average points]] sorted by label
    const m=new Map(); rows.forEach(r=>{ const k=key(r); const v=m.get(k)||[0,0,0]; v[0]++; v[1]+=(+r.pct||0); v[2]+=pts(r.score,r.n); m.set(k,v); });
    return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,[n,sum,sp]])=>[k,n,sum/n,sp/n]);
  };
  const sumTable=(title,list)=>`<div class="tbl-scroll"><table class="data">
      <thead><tr><th>${esc(title)}</th><th class="num">${esc(t("thAttempts"))}</th><th class="num">${esc(t("thAvg"))}</th><th class="num">${esc(t("thPts"))}</th></tr></thead>
      <tbody>${list.map(([k,n,a,ap])=>`<tr><td>${esc(k)}</td><td class="num">${n}</td><td class="num">${a.toFixed(0)}%</td><td class="num"><b>${fmtPts(ap)}</b></td></tr>`).join("")}</tbody></table></div>`;
  const lectures=by(r=>String(r.bank||"").split(" — ")[0]||"—"), groups=by(r=>grpLabel(r.group)||"—");
  out.innerHTML=`<div class="controls" style="margin:12px 0 10px">
      <span class="ctl"><label>${esc(t("code"))}</label><select id="e-clsf"><option value="">${esc(t("clsAll"))}</option>${
        classes.map(c=>`<option value="${esc(c)}"${c===CLS.filter?" selected":""}>${esc(c)}</option>`).join("")}</select></span>
      <span class="meta">${rows.length} ${esc(t(rows.length===1?"clsCount1":"clsCount"))} · ${esc(t("clsAvg"))} ${avg.toFixed(0)}% · ${fmtPts(avgPts)}/${PTS_MAX} ${esc(t("ptsUnit"))}</span>
      <button class="btn" id="e-del">${esc(t("delSel"))} (<span id="e-deln">0</span>)</button>
      <span class="hint" id="e-delmsg"></span>
    </div>
    <div class="grid g2" style="margin:0 0 14px">${sumTable(t("avgLecture"),lectures)}${sumTable(t("avgGroup"),groups)}</div>
    <div class="tbl-scroll"><table class="data">
      <thead><tr><th></th><th>${esc(t("thDate"))}</th><th>${esc(t("code"))}</th><th>${esc(t("klass"))}</th><th>${esc(t("thAtt"))}</th><th class="num">${esc(t("thScore"))}</th><th class="num">${esc(t("thPts"))}</th><th class="num">${esc(t("thT"))}</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td><input type="checkbox" class="rdel" data-id="${esc(r.id)}"></td><td style="font-family:var(--mono)">${esc(fmtLocal(r.date))}</td><td>${esc(r.class||"—")}</td><td>${esc(grpLabel(r.group)||"—")}<br><span class="meta">${esc(r.bank)}</span></td><td style="font-family:var(--mono)">${esc(r.id)}</td><td class="num">${esc(r.score)}/${esc(r.n)} · ${esc(r.pct)}%</td><td class="num"><b>${fmtPts(pts(r.score,r.n))}</b></td><td class="num">${fmtTime(+r.secs||0)}</td></tr>`).join("")}</tbody>
    </table></div>`;
  $("#e-clsf").onchange=e=>{ CLS.filter=e.target.value; drawClass(); };
  const updDel=()=>{ const n=document.querySelectorAll(".rdel:checked").length; const s2=$("#e-deln"); if(s2) s2.textContent=n; };
  document.querySelectorAll(".rdel").forEach(c=>c.onchange=updDel); updDel();
  $("#e-del").onclick=async ()=>{
    const ids=[...document.querySelectorAll(".rdel:checked")].map(c=>c.dataset.id);
    if(!ids.length) return;
    if(!confirm(t("delConf").replace("{n}",ids.length))) return;
    const btn=$("#e-del"), msg=$("#e-delmsg"); btn.disabled=true; msg.textContent="";
    const url=submitURL(), fails=[];
    for(const id of ids){
      try{
        const r=await toWorker(url,{action:"delresult",code:TRCODE,id});
        const j=await r.json().catch(()=>({}));
        if(!(r.ok&&j.ok)) fails.push(id);
      }catch(e){ fails.push(id); }
    }
    btn.disabled=false;
    const doneMsg=fails.length ? t("delFail")+" "+fails.join(", ") : t("delDone");
    await fetchClass(); drawClass();
    const m2=$("#e-delmsg"); if(m2) m2.textContent=doneMsg;
  };
}

/* ---------- language ---------- */
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.querySelectorAll(".langsel button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
  document.querySelectorAll("[data-t]").forEach(n=>{ const k=n.getAttribute("data-t"); if(STR[l][k]!==undefined) n.textContent=STR[l][k]; });
  P._lang=l; drawKind(); renderTabs(); renderPage();
}
document.querySelectorAll(".langsel button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".kindsel button").forEach(b=>b.onclick=()=>setKind(b.dataset.kind));
const ONLY_LANG = "en"; // 2026/27: English only, PT/EN switch hidden; set to "" to bring the switch back
if(ONLY_LANG) $(".langsel").style.display="none";

/* ---------- init ---------- */
projReshuffle();
setLang(ONLY_LANG||"en");
loadPT();
</script>
